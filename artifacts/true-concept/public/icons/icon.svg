<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b85535"/>
      <stop offset="60%" style="stop-color:#da6b45"/>
      <stop offset="100%" style="stop-color:#f5a584"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#da6b45;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Decorative blob -->
  <ellipse cx="420" cy="90" rx="130" ry="130" fill="url(#glow)"/>
  <!-- TC text -->
  <text x="256" y="340"
    font-family="'Nunito', 'Inter', Arial, sans-serif"
    font-weight="900"
    font-size="248"
    fill="white"
    text-anchor="middle"
    opacity="1">TC</text>
  <!-- Subtitle dot accent -->
  <circle cx="256" cy="390" r="12" fill="rgba(255,255,255,0.4)"/>
</svg>
